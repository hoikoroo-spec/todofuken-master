['北海道','ほっかいどう','🦀','カニやじゃがいも、広い大地で有名！'],['青森県','あおもり','🍎','りんごの生産が盛んな県だよ。'],['岩手県','いわて','🍜','わんこそばが有名！'],['宮城県','みやぎ','🐮','牛タンや七夕まつりで有名！'],['秋田県','あきた','👹','なまはげやきりたんぽが有名！'],['山形県','やまがた','🍒','さくらんぼの生産が盛ん！'],['福島県','ふくしま','🍑','桃の生産が盛んな県だよ。'],['茨城県','いばらき','🥔','ほしいもや納豆が有名！'],['栃木県','とちぎ','🍓','いちごの生産が盛ん！'],['群馬県','ぐんま','♨️','草津温泉が有名！'],['埼玉県','さいたま','🍘','草加せんべいや川越で有名！'],['千葉県','ちば','🥜','落花生の生産が盛ん！'],['東京都','とうきょう','🗼','東京タワーやスカイツリーがあるよ。'],['神奈川県','かながわ','🚢','横浜の港や鎌倉が有名！'],['新潟県','にいがた','🍚','お米の産地として有名！'],['富山県','とやま','🦑','ホタルイカが有名！'],['石川県','いしかわ','🍡','金沢の兼六園や和菓子が有名！'],['福井県','ふくい','🦖','恐竜の化石がたくさん見つかっているよ。'],['山梨県','やまなし','🍇','ぶどうや桃の生産が盛ん！'],['長野県','ながの','🍎','りんごやそば、山々で有名！'],['岐阜県','ぎふ','🏘️','白川郷の合掌造りで有名！'],['静岡県','しずおか','🍵','お茶や富士山で有名！'],['愛知県','あいち','🏯','名古屋城やみそカツが有名！'],['三重県','みえ','🦐','伊勢えびや伊勢神宮が有名！'],['滋賀県','しが','🚣','日本最大の湖・琵琶湖があるよ。'],['京都府','きょうと','⛩️','清水寺など歴史あるお寺がたくさん！'],['大阪府','おおさか','🐙','たこ焼きや大阪城が有名！'],['兵庫県','ひょうご','🐄','神戸牛や姫路城で有名！'],['奈良県','なら','🦌','奈良公園の鹿や大仏で有名！'],['和歌山県','わかやま','🍊','みかんや梅の生産が盛ん！'],['鳥取県','とっとり','🏜️','鳥取砂丘が有名！'],['島根県','しまね','⛩️','出雲大社が有名！'],['岡山県','おかやま','🍑','桃やきびだんごが有名！'],['広島県','ひろしま','🦪','かきや宮島の厳島神社で有名！'],['山口県','やまぐち','🐡','ふぐ料理で有名！'],['徳島県','とくしま','💃','阿波おどりが有名！'],['香川県','かがわ','🍜','讃岐うどんが有名！'],['愛媛県','えひめ','🍊','みかんの生産が盛ん！'],['高知県','こうち','🐟','かつおのたたきが有名！'],['福岡県','ふくおか','🍜','博多ラーメンや明太子が有名！'],['佐賀県','さが','🏺','有田焼などの焼き物で有名！'],['長崎県','ながさき','🍰','カステラや長崎の港で有名！'],['熊本県','くまもと','🏯','熊本城や阿蘇山が有名！'],['大分県','おおいた','♨️','別府や由布院の温泉が有名！'],['宮崎県','みやざき','🥭','マンゴーや高千穂峡が有名！'],['鹿児島県','かごしま','🌋','桜島やさつまいもが有名！'],['沖縄県','おきなわ','🌺','美しい海やシーサーで有名！'] ];
const aliases={'北海道':'Hokkaido','青森県':'Aomori','岩手県':'Iwate','宮城県':'Miyagi','秋田県':'Akita','山形県':'Yamagata','福島県':'Fukushima','茨城県':'Ibaraki','栃木県':'Tochigi','群馬県':'Gunma','埼玉県':'Saitama','千葉県':'Chiba','東京都':'Tokyo','神奈川県':'Kanagawa','新潟県':'Niigata','富山県':'Toyama','石川県':'Ishikawa','福井県':'Fukui','山梨県':'Yamanashi','長野県':'Nagano','岐阜県':'Gifu','静岡県':'Shizuoka','愛知県':'Aichi','三重県':'Mie','滋賀県':'Shiga','京都府':'Kyoto','大阪府':'Osaka','兵庫県':'Hyogo','奈良県':'Nara','和歌山県':'Wakayama','鳥取県':'Tottori','島根県':'Shimane','岡山県':'Okayama','広島県':'Hiroshima','山口県':'Yamaguchi','徳島県':'Tokushima','香川県':'Kagawa','愛媛県':'Ehime','高知県':'Kochi','福岡県':'Fukuoka','佐賀県':'Saga','長崎県':'Nagasaki','熊本県':'Kumamoto','大分県':'Oita','宮崎県':'Miyazaki','鹿児島県':'Kagoshima','沖縄県':'Okinawa'};
const $=id=>document.getElementById(id);const rand=n=>Math.floor(Math.random()*n);const shuffle=a=>a.sort(()=>Math.random()-.5);let mode='easy',current=null,queue=[],correct=0,done=new Set(),features=null,answered=false;try{done=new Set(JSON.parse(localStorage.getItem('todofuken_done')||'[]'))}catch(e){};
function norm(s){return String(s||'').normalize('NFKC').replace(/[\s　・ー]/g,'').replace(/[都道府県]$/,'').toLowerCase().replace(/ぁ/g,'ぁ')};
function kata(s){return s.replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+96))}
function valid(s,row){let n=norm(s),a=norm(row[0]),b=norm(row[1]);return n===a||n===b||n===kata(b)}
function save(){try{localStorage.setItem('todofuken_done',JSON.stringify([...done]))}catch(e){}}
function newQuestion(){if(!queue.length)queue=shuffle([...Array(47).keys()]);current=queue.pop();answered=false;$('result').classList.remove('show');$('choices').classList.remove('hidden');$('answerRow').classList.toggle('hidden',mode!=='hard');$('choices').innerHTML='';$('answer').value='';$('question').textContent='オレンジ色の都道府県はどこ？';$('progress').textContent=`クリア ${done.size} / 47`;$('score').textContent=`正解 ${correct} 問`;if(mode!=='hard'){let options=shuffle([current,...shuffle([...Array(47).keys()].filter(i=>i!==current)).slice(0,mode==='easy'?1:3)]);options.forEach(i=>{let b=document.createElement('button');b.textContent=data[i][0];b.onclick=()=>check(i===current);$('choices').append(b)})}renderMap()}
function check(ok){if(answered)return;answered=true;$('choices').classList.add('hidden');$('answerRow').classList.add('hidden');$('result').classList.add('show');$('mark').textContent=ok?'○':'×';$('mark').className='mark '+(ok?'ok':'ng');$('resultTitle').textContent=ok?`せいかい！ ${data[current][0]}`:'ざんねん！ もう一度おぼえよう';$('famous').textContent=data[current][2];$('fact').textContent=(ok?'✨ ':'答えは '+data[current][0]+'！ ')+data[current][3];if(ok){correct++;done.add(current);save()}$('score').textContent=`正解 ${correct} 問`;$('progress').textContent=`クリア ${done.size} / 47`;renderMap()}
$('submit').onclick=()=>check(valid($('answer').value,data[current]));$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('submit').click()});$('next').onclick=newQuestion;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));queue=[];newQuestion()});
// GeoJSON is fetched live; a geographic-position tile map remains available if offline.
const positions=[
[0,0],[1,3],[2,3],[3,4],[1,2],[2,2],[3,3],[4,5],[5,5],[5,4],[6,5],[6,6],[7,6],[7,5],[3,2],[4,2],[4,1],[5,1],[5,3],[4,3],[5,2],[6,4],[6,3],[6,2],[6,1],[7,2],[7,3],[7,1],[8,2],[8,1],[6,0],[5,0],[7,0],[8,0],[4,0],[8,4],[8,5],[8,3],[9,3],[9,1],[9,0],[10,0],[10,2],[10,1],[11,2],[11,1],[12,0]];
function fallback(){const el=document.createElement('div');el.className='fallback';let grid=document.createElement('div');grid.className='tiles';grid.style.gridTemplateColumns='repeat(13,1fr)';let lookup=new Map(positions.map((p,i)=>[p.join(','),i]));for(let y=0;y<7;y++)for(let x=0;x<13;x++){let cell=document.createElement('div'),i=lookup.get(x+','+y);cell.className='tile'+(i===current?' selected':done.has(i)?' done':'');cell.textContent=i===undefined?'':String(i+1);if(i===undefined)cell.style.visibility='hidden';grid.append(cell)}el.append(grid);$('map').replaceChildren(el);$('mapnote').textContent='※地図データを取得できないため、位置を表す簡易マップで表示しています（数字は県番号）。インターネット接続で再読み込みしてください。'}
function geomCoords(g){if(!g)return [];if(g.type==='Polygon')return [g.coordinates];if(g.type==='MultiPolygon')return g.coordinates;return []}
function renderMap(){if(!features){fallback();return}const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 650 680');svg.setAttribute('role','img');svg.setAttribute('aria-label','日本地図。オレンジ色の都道府県を答えよう');const pts=[];features.forEach(f=>geomCoords(f.geometry).forEach(poly=>poly.forEach(ring=>ring.forEach(p=>pts.push(p)))));if(!pts.length){fallback();return}const minX=Math.min(...pts.map(p=>p[0])),maxX=Math.max(...pts.map(p=>p[0])),minY=Math.min(...pts.map(p=>p[1])),maxY=Math.max(...pts.map(p=>p[1]));const sx=610/(maxX-minX),sy=635/(maxY-minY),scale=Math.min(sx,sy);const x0=20+(610-(maxX-minX)*scale)/2,y0=20+(635-(maxY-minY)*scale)/2;const project=p=>[(x0+(p[0]-minX)*scale).toFixed(2),(y0+(maxY-p[1])*scale).toFixed(2)];features.forEach(f=>{let name=String(f.properties.__name||'');let i=data.findIndex(d=>d[0]===name);geomCoords(f.geometry).forEach(poly=>{let d=poly.map(ring=>ring.map((p,k)=>(k?'L':'M')+project(p).join(' ')).join(' ')+' Z').join(' ');let path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',d);if(i===current)path.classList.add('selected');else if(done.has(i))path.classList.add('done');svg.append(path)})});$('map').replaceChildren(svg);$('mapnote').textContent='オレンジ色の都道府県を当ててね！'}
function getName(f){let p=f.properties||{};let vals=Object.values(p).filter(v=>typeof v==='string');for(let row of data){if(vals.some(v=>v===row[0]||v===row[1]||v.toLowerCase()===aliases[row[0]].toLowerCase()||v.toLowerCase()===aliases[row[0]].toLowerCase()+' prefecture'))return row[0]}return null}
async function loadMap(){const urls=['https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson','https://cdn.jsdelivr.net/gh/dataofjapan/land@master/japan.geojson'];for(let url of urls){try{let res=await fetch(url,{signal:AbortSignal.timeout(8000)});if(!res.ok)continue;let json=await res.json();let fs=json.features||[];let named=fs.map(f=>({...f,properties:{...f.properties,__name:getName(f)}})).filter(f=>f.properties.__name);if(named.length>=40){features=named;renderMap();return}}catch(e){}}}newQuestion();loadMap();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
